# Yüklenen medya (görsel/video) canlıda Next yerine bu nginx'ten servis edilir.
# Neden: Next route handler'ları Content-Length başlığını siler; Cloudflare dosya boyutunu bilemeyince
# videolara parçalı (206 / Range) cevap veremez ve iPhone Safari videoyu oynatmaz.
# nginx Content-Length, Range (206), ETag ve Last-Modified'ı doğru verir.
# Dosyalar: ./uploads → /usr/share/nginx/html/media (salt okunur). Adres: /media/<klasör>/<dosya>
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    location /media/ {
        try_files $uri =404;
        # Aynı adla dosya panelden değiştirilebilir: kısa önbellek + yeniden doğrulama (Next route ile aynı)
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        sendfile on;
        tcp_nopush on;
    }

    # 404 önbelleğe alınmasın: aksi halde Cloudflare sonradan yüklenen dosyayı saatlerce "yok" gösterir
    error_page 404 = @notfound;
    location @notfound {
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 404 "Bulunamadı";
    }

    location / {
        return 404;
    }
}
